{% extends "base.html" %}
{% block content %}
<h4 class="text-center">Lista Conteúdo</h4><br><br>
<hr>

<!-- Formulário de filtros -->
<form hx-get="{{ url_for('sala.listar_conteudo') }}" 
      hx-target="#conteudo-table" 
      hx-swap="outerHTML" 
      class="mb-4">
  <div class="row">
    <div class="col-md-4">
      <input type="text" name="titulo" class="form-control" placeholder="Buscar por título">
    </div>
    <div class="col-md-3">
      <select name="nivel" class="form-select">
        <option value="">Todos os níveis</option>
        <option value="basico">Básico</option>
        <option value="avancado">Avançado</option>
      </select>
    </div>
    <div class="col-md-3">
      <input type="date" name="data" class="form-control">
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">Filtrar</button>
    </div>
  </div>
</form>

<!-- Aqui a tabela será atualizada dinamicamente -->
<div id="conteudo-table">
  {% include '/sala/_conteudo_table.html' %}
</div>
{% endblock %}
