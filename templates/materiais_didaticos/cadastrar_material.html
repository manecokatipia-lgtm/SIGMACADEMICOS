<form hx-post="{{ url_for('material.cadastrar') }}" hx-target="#professor-list" enctype="multipart/form-data" hx-swap="outerHTML">
    <h2 class="text-center" id="prof_titulo">Cadastrar Disciplina</h2>
    <div class="mb-3">
        <div class="mb-3">
            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon2">@</span>
                <select class="form-select" aria-label="Default select example" name="material" id="material">
                    <option selected>Materiais Didáticos</option>
                    {% for material in material %}
                    <option value="{{material.id}}">{{material.titulo}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text">@</span>
                <input type="text" class="form-control" placeholder="Nome do Material"
                    aria-label="Recipient’s username" aria-describedby="basic-addon2" name="nome">
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text">@</span>
                <input type="text" class="form-control" placeholder="Tipo de Material"
                    aria-label="Recipient’s username" aria-describedby="basic-addon2" name="tipo">
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text">@</span>
                <input type="text" class="form-control" placeholder="Fale alguma coisa sobre o material..."
                    aria-label="Recipient’s username" aria-describedby="basic-addon2" name="descrisao">
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">@</span>
                <input type="date" class="form-control" placeholder="Data de Upload"
                    aria-label="Recipient’s username" aria-describedby="basic-addon2" name="data_upload">
            </div>

            <div class="input-group mb-3">
             <span class="input-group-text"><img src="{{ url_for('static', filename='img/foto.png') }}" alt="" width="20"
                    height="20"></span>
             <div class="form-floating">
                <input type="file" class="form-control" placeholder="Foto" aria-label="Recipient’s username"aria-describedby="basic-addon2" name="imagem" accept="imagem/*" required>
             </div>
           </div>

            <div class="mb-3">
                <button type="submit" class="btn btn-primary">Gravar</button>
            </div>

</form>
